<svg width="510" height="200" viewBox="0 0 540 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgMobile" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#050810"/>
      <stop offset="100%" stop-color="#0a0c19"/>
    </linearGradient>
  </defs>

  <rect width="540" height="1400" fill="url(#bgMobile)"/>

  <!-- Main Menu Panel -->
  <rect x="30" y="50" width="480" height="1200" rx="20" fill="#0a0c19" stroke="#1d2334" stroke-width="2"/>
  
  <!-- Title -->
  <text x="270" y="95" font-size="32" font-weight="700" fill="#ffffff" font-family="Arial, sans-serif" text-anchor="middle">Gravity</text>
  <text x="270" y="125" font-size="11" fill="#888888" font-family="Arial, sans-serif" text-anchor="middle">(200+ Toggles - Mobile)</text>

  <!-- Tab Bar -->
  <rect x="45" y="145" width="450" height="45" rx="10" fill="#1d2334"/>
  <text x="60" y="175" font-size="11" fill="#dcdcdc" font-family="Arial, sans-serif" font-weight="bold">Main</text>
  <text x="110" y="175" font-size="11" fill="#dcdcdc" font-family="Arial, sans-serif">Gameplay</text>
  <text x="195" y="175" font-size="11" fill="#dcdcdc" font-family="Arial, sans-serif">Movement</text>
  <text x="310" y="175" font-size="11" fill="#dcdcdc" font-family="Arial, sans-serif">Visual</text>
  <text x="385" y="175" font-size="11" fill="#dcdcdc" font-family="Arial, sans-serif">Speed</text>
  <text x="445" y="175" font-size="11" fill="#dcdcdc" font-family="Arial, sans-serif">Util</text>

  <!-- Toggle List (scrollable content showing ~40 visible toggles from 200) -->
  <g id="toggles">
    <!-- Column 1 (left side) -->
    <text x="60" y="215" font-size="12" fill="#e6e6e6" font-family="Arial, sans-serif">God Mode</text>
    <rect x="430" y="203" width="14" height="14" rx="2" fill="#1478c8"/>
    
    <text x="60" y="245" font-size="12" fill="#e6e6e6" font-family="Arial, sans-serif">No Clip</text>
    <rect x="430" y="233" width="14" height="14" rx="2" fill="#1478c8"/>
    
    <text x="60" y="275" font-size="12" fill="#e6e6e6" font-family="Arial, sans-serif">Instant Complete</text>
    <rect x="430" y="263" width="14" height="14" rx="2" fill="#1478c8"/>
    
    <text x="60" y="305" font-size="12" fill="#e6e6e6" font-family="Arial, sans-serif">Practice Button Gone</text>
    <rect x="430" y="293" width="14" height="14" rx="2" fill="#1478c8"/>
    
    <text x="60" y="335" font-size="12" fill="#e6e6e6" font-family="Arial, sans-serif">Speed Hack x2</text>
    <rect x="430" y="323" width="14" height="14" rx="2" fill="#1478c8"/>
    
    <text x="60" y="365" font-size="12" fill="#e6e6e6" font-family="Arial, sans-serif">Show Hitboxes</text>
    <rect x="430" y="353" width="14" height="14" rx="2" fill="#1478c8"/>
    
    <text x="60" y="395" font-size="12" fill="#e6e6e6" font-family="Arial, sans-serif">Macro Bot</text>
    <rect x="430" y="383" width="14" height="14" rx="2" fill="#1478c8"/>
    
    <text x="60" y="425" font-size="12" fill="#e6e6e6" font-family="Arial, sans-serif">Internal Recorder</text>
    <rect x="430" y="413" width="14" height="14" rx="2" fill="#1478c8"/>
    
    <text x="60" y="455" font-size="12" fill="#e6e6e6" font-family="Arial, sans-serif">Click Bot</text>
    <rect x="430" y="443" width="14" height="14" rx="2" fill="#1478c8"/>
    
    <text x="60" y="485" font-size="12" fill="#e6e6e6" font-family="Arial, sans-serif">No Trail</text>
    <rect x="430" y="473" width="14" height="14" rx="2" fill="#1478c8"/>
    
    <text x="60" y="515" font-size="12" fill="#e6e6e6" font-family="Arial, sans-serif">Auto Clicker</text>
    <rect x="430" y="503" width="14" height="14" rx="2" fill="#1478c8"/>
    
    <text x="60" y="545" font-size="12" fill="#e6e6e6" font-family="Arial, sans-serif">FPS Counter</text>
    <rect x="430" y="533" width="14" height="14" rx="2" fill="#1478c8"/>
    
    <text x="60" y="575" font-size="12" fill="#e6e6e6" font-family="Arial, sans-serif">Dual Gravity</text>
    <rect x="430" y="563" width="14" height="14" rx="2" fill="#1478c8"/>
    
    <text x="60" y="605" font-size="12" fill="#e6e6e6" font-family="Arial, sans-serif">Size Change</text>
    <rect x="430" y="593" width="14" height="14" rx="2" fill="#1478c8"/>
    
    <text x="60" y="635" font-size="12" fill="#e6e6e6" font-family="Arial, sans-serif">Scroll View</text>
    <rect x="430" y="623" width="14" height="14" rx="2" fill="#1478c8"/>
    
    <text x="60" y="665" font-size="12" fill="#e6e6e6" font-family="Arial, sans-serif">Rotate Gravity</text>
    <rect x="430" y="653" width="14" height="14" rx="2" fill="#1478c8"/>
    
    <text x="60" y="695" font-size="12" fill="#e6e6e6" font-family="Arial, sans-serif">Wave Trail</text>
    <rect x="430" y="683" width="14" height="14" rx="2" fill="#1478c8"/>
    
    <text x="60" y="725" font-size="12" fill="#e6e6e6" font-family="Arial, sans-serif">UFO Mode</text>
    <rect x="430" y="713" width="14" height="14" rx="2" fill="#1478c8"/>
    
    <text x="60" y="755" font-size="12" fill="#e6e6e6" font-family="Arial, sans-serif">Robot Mode</text>
    <rect x="430" y="743" width="14" height="14" rx="2" fill="#1478c8"/>
    
    <text x="60" y="785" font-size="12" fill="#e6e6e6" font-family="Arial, sans-serif">Spider Mode</text>
    <rect x="430" y="773" width="14" height="14" rx="2" fill="#1478c8"/>
    
    <text x="60" y="815" font-size="12" fill="#e6e6e6" font-family="Arial, sans-serif">Ball Mode</text>
    <rect x="430" y="803" width="14" height="14" rx="2" fill="#1478c8"/>
    
    <text x="60" y="845" font-size="12" fill="#e6e6e6" font-family="Arial, sans-serif">Wave Mode</text>
    <rect x="430" y="833" width="14" height="14" rx="2" fill="#1478c8"/>
    
    <text x="60" y="875" font-size="12" fill="#e6e6e6" font-family="Arial, sans-serif">Invisible Objects</text>
    <rect x="430" y="863" width="14" height="14" rx="2" fill="#1478c8"/>
    
    <text x="60" y="905" font-size="12" fill="#e6e6e6" font-family="Arial, sans-serif">Invisible Spikes</text>
    <rect x="430" y="893" width="14" height="14" rx="2" fill="#1478c8"/>
    
    <text x="60" y="935" font-size="12" fill="#e6e6e6" font-family="Arial, sans-serif">Hide UI</text>
    <rect x="430" y="923" width="14" height="14" rx="2" fill="#1478c8"/>
    
    <text x="60" y="965" font-size="12" fill="#e6e6e6" font-family="Arial, sans-serif">Rainbow Mode</text>
    <rect x="430" y="953" width="14" height="14" rx="2" fill="#1478c8"/>
    
    <text x="60" y="995" font-size="12" fill="#e6e6e6" font-family="Arial, sans-serif">Pulse Effect</text>
    <rect x="430" y="983" width="14" height="14" rx="2" fill="#1478c8"/>
    
    <text x="60" y="1025" font-size="12" fill="#e6e6e6" font-family="Arial, sans-serif">Psycho Mode</text>
    <rect x="430" y="1013" width="14" height="14" rx="2" fill="#1478c8"/>
    
    <text x="60" y="1055" font-size="12" fill="#e6e6e6" font-family="Arial, sans-serif">Noclip Frame</text>
    <rect x="430" y="1043" width="14" height="14" rx="2" fill="#1478c8"/>
    
    <text x="60" y="1085" font-size="12" fill="#e6e6e6" font-family="Arial, sans-serif">Gravity Invert</text>
    <rect x="430" y="1073" width="14" height="14" rx="2" fill="#1478c8"/>
    
    <!-- Scroll indicator -->
    <text x="270" y="1130" font-size="10" fill="#666666" font-family="Arial, sans-serif" text-anchor="middle">... scroll for 170+ more toggles ...</text>
  </g>

  <!-- Bottom Bar -->
  <rect x="30" y="1270" width="480" height="50" rx="12" fill="#1d2334"/>
  <text x="100" y="1303" font-size="12" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold">SAVE</text>
  <text x="270" y="1303" font-size="12" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold">LOAD</text>
  <text x="430" y="1303" font-size="12" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold">RESET</text>

  <!-- Floating Button (bottom right corner) -->
  <circle cx="480" cy="1330" r="35" fill="#1478c8"/>
  <circle cx="480" cy="1330" r="32" fill="#0d5a9c"/>
  <text x="480" y="1345" font-size="40" font-weight="700" fill="#ffffff" font-family="Arial, sans-serif" text-anchor="middle">G</text>
  
  <!-- Glow -->
  <circle cx="480" cy="1330" r="40" fill="none" stroke="#1478c8" stroke-width="1" opacity="0.4"/>
</svg>
