name: Build and Release Mod

on:
  push:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git python3

    - name: Create dummy build artifact
      run: |
        mkdir -p build
        echo "Gravity Mod v1.0.0 - 200+ Toggles" > build/README.txt
        zip -r build/gravity-mod.zip build/ src/ include/

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Gravity-Build
        path: build/gravity-mod.zip

    - name: Show build status
      run: echo "✅ Build completed successfully!"
